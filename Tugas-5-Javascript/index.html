<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Manajemen Produk Toko</h1>

        <div class="form-produk">
            <h2>Tambah Produk</h2>

            <input type="text" id="namaProduk" placeholder="Nama Produk">
            <input type="number" id="hargaProduk" placeholder="Harga Produk">
            <input type="number" id="stokProduk" placeholder="Stok Produk">

            <button id="btnTambah">Tambah Produk</button>
        </div>

        <div class="daftar-produk">
            <h2>Daftar Produk</h2>
            
            <div id="listProduk"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
