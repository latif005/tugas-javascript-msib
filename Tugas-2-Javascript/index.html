<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pegawai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Data Pegawai</h2>

    <table>
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
            </tr>
        </thead>

        <tbody id="dataPegawai">
            <!-- Data pegawai akan ditampilkan melalui JavaScript -->
        </tbody>

        <tfoot>
            <tr>
                <th colspan="4">Total Gaji</th>
                <th colspan="4" id="totalGaji"></th>
            </tr>
        </tfoot>
    </table>

    <script src="script.js"></script>
</body>
</html>
